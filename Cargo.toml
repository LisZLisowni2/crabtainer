[package]
name = "MiniDocker"
version = "0.1.0"
edition = "2024"

[dependencies]
nix = { version = "0.31.3", features = ["sched", "hostname", "mount", "fs"] }
reqwest = { version = "0.13.4", features = ["stream"] }
rand = "0.10.2"
clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
indicatif = "0.18.6"
futures-util = "0.3.33"