[package]
name = "rustocker"
license = "Apache-2.0 OR MIT"
version = "0.1.0"
edition = "2024"
authors = ["LisZLisowni2"]

[dependencies]
nix = { version = "0.31.3", features = ["sched", "hostname", "mount", "fs"] }
reqwest = { version = "0.13.4", features = ["stream"] }
rand = "0.10.2"
clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
indicatif = "0.18.6"
futures-util = "0.3.33"
is-root = "0.1.3"
globset = "0.4.20"
walkdir = "2.5.0"
glob = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
oci-spec = "0.10.0"

[dev-dependencies]
tempfile = "3.27.0"
httpmock = "0.8.3"
