[package]
name = "rustocker"
license = "Apache-2.0 OR MIT"
version = "0.3.1"
edition = "2024"
authors = ["LisZLisowni2"]

[dependencies]
nix = { version = "0.31.3", features = ["sched", "hostname", "mount", "fs", "term", "signal"] }
rand = "0.10.2"
clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
is-root = "0.1.3"
globset = "0.4.20"
walkdir = "2.5.0"
glob = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
oci-spec = "0.10.0"
oci-client = "0.17.0"
flate2 = "1.1.9"
tar = "0.4.46"
rtnetlink = "0.22.0"
futures = "0.3.34"
ipnet = {  version = "2.12.1", features = ["serde"] }
thiserror = "2.0.20"
iptables = "0.6.0"
crossterm = "0.29.0"
getch-rs = "0.2.0"

[dev-dependencies]
tempfile = "3.27.0"