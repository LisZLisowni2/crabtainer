name: Bug Report
description: Create a report to help us reproduce and fix a bug in rustocker.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! 
        
        **Note:** If this is a security vulnerability, please **do not** open an issue. Follow our [Security Policy](SECURITY.md) to report it privately.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: e.g., rustocker panics when pulling a multi-architecture image...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run command '...'
        2. Set configuration '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Logs / Screenshots
      description: Copy and paste relevant terminal output, backtraces, or drop screenshots here.
      render: shell

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Operating system name and version of it
      placeholder: |
        e.g. Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Rust Version
      placeholder: Output of `rustc --version` (e.g., 1.78.0)
    validations:
      required: false
