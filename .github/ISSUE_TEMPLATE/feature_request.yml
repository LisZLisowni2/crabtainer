name: ✨ Feature Request
description: Suggest an idea or enhancement for rustocker.
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make **rustocker** better! Please fill out the sections below to help explain your idea.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is (e.g., "I'm frustrated when...")
      placeholder: e.g., Currently, rustocker doesn't support authenticating with private registries via token...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or CLI behavior you'd like to see.
      placeholder: e.g., Add a `--token` flag or support reading $CR_PAT environment variable...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions or Workarounds
      description: Have you considered any alternative solutions or features?
      placeholder: e.g., Manually setting up a docker config file works, but it's cumbersome...

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, CLI examples, or API references about the feature request here.
